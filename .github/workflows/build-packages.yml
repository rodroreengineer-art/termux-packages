# Builds the curated package set for all 4 ABIs and publishes a signed apt
# repository to the rodroreengineer-art/termux-repo repository (served via
# GitHub Pages). Place this at `.github/workflows/build-packages.yml` in the
# rodroreengineer-art/termux-packages fork.
#
# The package-builder container needs FUSE + CAP_SYS_ADMIN + AppArmor, so the
# build runs through scripts/run-docker.sh on the host runner (not a
# `container:` job), matching upstream termux-packages.
#
# Required secrets (set on the termux-packages fork):
#   GPG_SIGNING_KEY  - armored private GPG key used to sign the repo
#   GH_PUSH_TOKEN    - PAT with repo scope to push the repo to termux-repo

name: Build packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names to build (default: packages.txt)"
        required: false
        default: ""
  push:
    branches: [ master ]
    paths:
      - packages.txt
      - scripts/properties.sh
      - .github/workflows/build-packages.yml

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      - name: Build packages
        env:
          PKGS: ${{ github.event.inputs.packages }}
        run: |
          if [ -n "$PKGS" ]; then
            LIST="$PKGS"
          else
            LIST="$(tr '\n' ' ' < packages.txt)"
          fi
          echo "Building for ${{ matrix.arch }}: $LIST"
          ./scripts/run-docker.sh ./build-package.sh -F -a "${{ matrix.arch }}" $LIST

      - name: Collect debs
        run: |
          mkdir -p debs
          find output -name '*.deb' -exec cp -n {} debs/ \; 2>/dev/null || true
          echo "Collected $(find debs -name '*.deb' | wc -l) packages"

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: debs/*.deb
          if-no-files-found: error

  publish:
    name: Publish apt repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all debs
        uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          merge-multiple: true
          path: debs

      - name: Install termux-apt-repo
        run: pip3 install termux-apt-repo

      - name: Import GPG key
        run: printf '%s' "${{ secrets.GPG_SIGNING_KEY }}" | gpg --batch --import

      - name: Generate signed repository
        run: termux-apt-repo --sign debs repo stable main

      - name: Publish to termux-repo
        env:
          TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "Android Code Studio"
          git config --global user.email "packages@rodroid.codestudio"
          rm -rf termux-repo-host
          git clone "https://x-access-token:${TOKEN}@github.com/rodroreengineer-art/termux-repo.git" termux-repo-host
          cd termux-repo-host
          git checkout -B gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../repo/. ./
          git add -A
          git commit -m "Publish packages $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git push origin gh-pages --force
