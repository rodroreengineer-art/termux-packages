# Relocate Termux's *prebuilt* packages to the com.rodroid.codestudio prefix
# and publish a signed apt repository. This is the fast path: instead of
# rebuilding rust/llvm/openjdk from source (which exceeds GitHub's 6h/job
# limit), we download Termux's published debs, rewrite the baked-in
# /data/data/com.termux prefix (ELF rpaths + shebangs + text configs), repack,
# and re-sign. Runs in ~10-15 minutes.
#
# Place at `.github/workflows/relocate-packages.yml` in the
# rodroreengineer-art/termux-packages fork.
#
# Required secrets (set on the fork):
#   GPG_SIGNING_KEY  - armored private GPG key used to sign the repo
#   GH_PUSH_TOKEN    - PAT with repo scope to push the repo to termux-repo

name: Relocate packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relocate:
    name: Relocate (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install patchelf (static binary, no apt)
        run: |
          # The runner's apt mirror (azure.archive.ubuntu.com) hangs on
          # apt-get update, so use patchelf's static release binary instead.
          curl -sL --retry 3 \
            "https://github.com/NixOS/patchelf/releases/download/0.19.1/patchelf-0.19.1-x86_64.tar.gz" \
            -o patchelf.tgz
          tar xzf patchelf.tgz
          sudo install bin/patchelf /usr/local/bin/patchelf
          patchelf --version

      - name: Relocate packages
        run: |
          python3 relocate.py \
            --arch "${{ matrix.arch }}" \
            --packages packages.txt \
            --out output

      - name: Collect debs
        run: |
          mkdir -p debs
          # Debian epochs use ':' (e.g. 1:2026.07.16), which upload-artifact
          # rejects. Sanitize the filename; termux-apt-repo reads the epoch
          # from the .deb control data, so the version stays correct.
          find output -name '*.deb' -print0 | while IFS= read -r -d '' f; do
            cp -n "$f" "debs/$(basename "$f" | tr ':' '_')"
          done
          echo "Collected $(find debs -name '*.deb' | wc -l) packages"

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: debs/*.deb
          if-no-files-found: error

  publish:
    name: Publish apt repository
    needs: relocate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all debs
        uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          merge-multiple: true
          path: debs

      - name: Install termux-apt-repo
        run: pip3 install termux-apt-repo

      - name: Import GPG key
        run: printf '%s' "${{ secrets.GPG_SIGNING_KEY }}" | gpg --batch --import

      - name: Generate signed repository
        run: termux-apt-repo --sign debs repo stable main

      - name: Publish to termux-repo
        env:
          TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "Android Code Studio"
          git config --global user.email "packages@rodroid.codestudio"
          rm -rf termux-repo-host
          git clone "https://x-access-token:${TOKEN}@github.com/rodroreengineer-art/termux-repo.git" termux-repo-host
          cd termux-repo-host
          git checkout -B gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../repo/. ./
          git add -A
          git commit -m "Publish packages $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git push origin gh-pages --force
