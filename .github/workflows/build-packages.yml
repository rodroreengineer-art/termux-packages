# Builds the curated package set for all 4 ABIs and publishes a signed apt
# repository to the rodroreengineer-art/termux-repo repository (served via
# GitHub Pages). Place this at `.github/workflows/build-packages.yml` in the
# rodroreengineer-art/termux-packages fork.
#
# The package-builder container needs FUSE + CAP_SYS_ADMIN + AppArmor, so the
# build runs through scripts/run-docker.sh on the host runner (not a
# `container:` job), matching upstream termux-packages.
#
# Required secrets (set on the termux-packages fork):
#   GPG_SIGNING_KEY  - armored private GPG key used to sign the repo
#   GH_PUSH_TOKEN    - PAT with repo scope to push the repo to termux-repo

name: Build packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated package names to build (default: packages.txt)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable zram (16G swap)
        uses: ./.github/actions/zram
        continue-on-error: true
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      - name: Install missing Android SDK components
        # termux-am (dep of termux-tools -> pkg) compiles an APK via Gradle and
        # needs platforms;android-33 + build-tools;30.0.3, which the
        # package-builder image does not ship. Pre-install them into the
        # container (run-docker.sh reuses the named container on the next call).
        run: |
          ./scripts/run-docker.sh bash -c '
            set -e
            . ./scripts/properties.sh
            SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
            if [ ! -x "$SDKMGR" ]; then
              echo "sdkmanager not found in $ANDROID_HOME" >&2
              find "$ANDROID_HOME" -name sdkmanager >&2
              exit 1
            fi
            yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
            yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" \
              "platforms;android-33" \
              "build-tools;30.0.3"
            echo "Installed SDK components:"
            ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          '

      - name: Build packages
        env:
          PKGS: ${{ github.event.inputs.packages }}
        run: |
          if [ -n "$PKGS" ]; then
            LIST="$PKGS"
          else
            LIST="$(grep -vE '^\s*#' packages.txt | tr '\n' ' ')"
          fi
          echo "Building for ${{ matrix.arch }}: $LIST"
          ./scripts/run-docker.sh ./build-package.sh -F -a "${{ matrix.arch }}" $LIST

      - name: Collect debs
        run: |
          mkdir -p debs
          # Debian epochs use ':' (e.g. 1:2026.07.16), which upload-artifact
          # rejects. Sanitize the filename; the epoch lives in the .deb control
          # data so termux-apt-repo still reads the correct version.
          find output -name '*.deb' -print0 | while IFS= read -r -d '' f; do
            cp -n "$f" "debs/$(basename "$f" | tr ':' '_')"
          done
          echo "Collected $(find debs -name '*.deb' | wc -l) packages"

      - name: Upload debs
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: debs/*.deb
          if-no-files-found: error

  publish:
    name: Publish apt repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download all debs
        uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          merge-multiple: true
          path: debs

      - name: Install termux-apt-repo
        run: pip3 install termux-apt-repo

      - name: Import GPG key
        run: printf '%s' "${{ secrets.GPG_SIGNING_KEY }}" | gpg --batch --import

      - name: Generate signed repository
        run: termux-apt-repo --sign debs repo stable main

      - name: Publish to termux-repo
        env:
          TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "Android Code Studio"
          git config --global user.email "packages@rodroid.codestudio"
          rm -rf termux-repo-host
          git clone "https://x-access-token:${TOKEN}@github.com/rodroreengineer-art/termux-repo.git" termux-repo-host
          cd termux-repo-host
          git checkout -B gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../repo/. ./
          git add -A
          git commit -m "Publish packages $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nothing to commit"
          git push origin gh-pages --force
